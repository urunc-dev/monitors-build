name: Get/Build Qemu artifacts

on:
  workflow_call:
    inputs:
      qemu_version:
        description: 'Qemu version to build'
        type: string
        required: false
        default: 'v10.1.1'
      qemu_commit:
        description: 'The commit that the Qemu version tag must point to'
        type: string
        required: true
      build_id:
        description: 'Identifies the Qemu build in release descriptions'
        type: string
        required: true
      arch:
        description: 'The CPU architecture to build Solo5'
        type: string
        required: false
        default: '["amd64", "arm64"]'
      runner-arch-map:
        description: 'Mapping of CPU architecture to runner names'
        type: string
        required: false
        default: '{"amd64":"ubuntu-24.04", "arm64":"ubuntu-24.04-arm"}'
    outputs:
      release:
        description: 'The release that already contains this Qemu build, empty if it was built in this run'
        value: ${{ jobs.find-cached-release.outputs.release }}

jobs:
  find-cached-release:
    name: Find a release with the same Qemu build
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.find.outputs.release }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Search the releases
        id: find
        uses: ./.github/actions/find-release/
        with:
          marker: '<!-- qemu: ${{ inputs.build_id }} -->'
          token: ${{ secrets.GITHUB_TOKEN }}

  build-Qemu:
    name: Build Qemu static binaries
    needs: [find-cached-release]
    if: ${{ needs.find-cached-release.outputs.release == '' }}
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arch) }}
    runs-on: ${{ fromJSON(inputs.runner-arch-map)[matrix.arch] }}
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential ninja-build libglib2.0-dev libaio-dev liburing-dev libseccomp-dev libcap-ng-dev librados-dev

      - name: Fetch Qemu
        uses: ./.github/actions/clone-verified/
        with:
          repository: https://github.com/qemu/qemu.git
          version: ${{ inputs.qemu_version }}
          commit: ${{ inputs.qemu_commit }}
          path: qemu_source

      - name: Configure and build Qemu
        run: |
          CONFIG=$( cat qemu/${{ matrix.arch }}.config )
          cd qemu_source
          printf %s "$CONFIG" | xargs ./configure
          make -j$(nproc)
          make install DESTDIR="/tmp/qemu_build"
       
      - name: Remove unncessary files
        run: |
          source qemu/unnecessary_files.txt
          cd /tmp/qemu_build
          for pattern in "${qemu_black_list[@]}"
          do
            find . -path "$pattern" | xargs rm -rfv
          done

      # Qemu requires its firmware files, hence it is provided as a tar, as in
      # the releases. The tar also preserves the file permissions.
      - name: Package Qemu
        run: |
          tar -C /tmp/qemu_build/opt -czf qemu-${{ matrix.arch }}.tar.gz .

      - name: Archive Qemu artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-${{ matrix.arch }}
          path: qemu-${{ matrix.arch }}.tar.gz
