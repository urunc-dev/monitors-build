name: Get/Build Solo5 artifacts

on:
  workflow_call:
    inputs:
      solo5_version:
        description: 'Solo5 version to build'
        type: string
        required: false
        default: 'v0.9.3'
      solo5_commit:
        description: 'The commit that the Solo5 version tag must point to'
        type: string
        required: true
      build_id:
        description: 'Identifies the Solo5 build in release descriptions'
        type: string
        required: true
      arch:
        description: 'The CPU architecture to build Solo5'
        type: string
        required: false
        default: '["amd64", "arm64"]'
      runner-arch-map:
        description: 'Mapping of CPU architecture to runner names'
        type: string
        required: false
        default: '{"amd64":"ubuntu-22.04", "arm64":"ubuntu-22.04-arm"}'
    outputs:
      release:
        description: 'The release that already contains this Solo5 build, empty if it was built in this run'
        value: ${{ jobs.find-cached-release.outputs.release }}

jobs:
  find-cached-release:
    name: Find a release with the same Solo5 build
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.find.outputs.release }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Search the releases
        id: find
        uses: ./.github/actions/find-release/
        with:
          marker: '<!-- solo5: ${{ inputs.build_id }} -->'
          token: ${{ secrets.GITHUB_TOKEN }}

  build-Solo5:
    name: Build Solo5 static binaries
    needs: [find-cached-release]
    if: ${{ needs.find-cached-release.outputs.release == '' }}
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arch) }}
    runs-on: ${{ fromJSON(inputs.runner-arch-map)[matrix.arch] }}
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libseccomp-dev pkg-config bc

      - name: Fetch Solo5
        uses: ./.github/actions/clone-verified/
        with:
          repository: https://github.com/Solo5/solo5.git
          version: ${{ inputs.solo5_version }}
          commit: ${{ inputs.solo5_commit }}
          path: solo5_source
          depth: '0'

      - name: Build Solo5-hvt and Solo5-spt
        run: |
          cd solo5_source
          sed -i '66 a\HOSTLDFLAGS += -static-pie' tenders/GNUmakefile
          ./configure.sh && make -j$(nproc)

      # Name the binaries as in the releases
      - name: Rename Solo5-hvt and Solo5-spt
        run: |
          mv solo5_source/tenders/hvt/solo5-hvt solo5-hvt-${{ matrix.arch }}
          mv solo5_source/tenders/spt/solo5-spt solo5-spt-${{ matrix.arch }}

      - name: Archive Solo5-hvt artifact
        uses: actions/upload-artifact@v4
        with:
          name: solo5-hvt-${{ matrix.arch }}
          path: solo5-hvt-${{ matrix.arch }}

      - name: Archive Solo5-spt artifact
        uses: actions/upload-artifact@v4
        with:
          name: solo5-spt-${{ matrix.arch }}
          path: solo5-spt-${{ matrix.arch }}
