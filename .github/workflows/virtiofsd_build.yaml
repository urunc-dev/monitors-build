name: Get/Build Virtiofsd artifacts

on:
  workflow_call:
    inputs:
      virtiofsd_version:
        description: 'Virtiofsd version to build'
        type: string
        required: false
        default: 'v1.13.1'
      virtiofsd_commit:
        description: 'The commit that the Virtiofsd version tag must point to'
        type: string
        required: true
      build_id:
        description: 'Identifies the Virtiofsd build in release descriptions'
        type: string
        required: true
      arch:
        description: 'The CPU architecture to build Virtiofsd'
        type: string
        required: false
        default: '["amd64", "arm64"]'
      runner-arch-map:
        description: 'Mapping of CPU architecture to runner names'
        type: string
        required: false
        default: '{"amd64":"ubuntu-24.04", "arm64":"ubuntu-24.04-arm"}'
    outputs:
      release:
        description: 'The release that already contains this Virtiofsd build, empty if it was built in this run'
        value: ${{ jobs.find-cached-release.outputs.release }}

jobs:
  find-cached-release:
    name: Find a release with the same Virtiofsd build
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.find.outputs.release }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Search the releases
        id: find
        uses: ./.github/actions/find-release/
        with:
          marker: '<!-- virtiofsd: ${{ inputs.build_id }} -->'
          token: ${{ secrets.GITHUB_TOKEN }}

  build-Virtiofsd:
    name: Build Virtiofsd static binaries
    needs: [find-cached-release]
    if: ${{ needs.find-cached-release.outputs.release == '' }}
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arch) }}
    runs-on: ${{ fromJSON(inputs.runner-arch-map)[matrix.arch] }}
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Map arch names
        id: arch_map
        run: |
          if [ ${{ matrix.arch }} == "amd64" ]
          then
            echo "target=x86_64-unknown-linux-musl" >> $GITHUB_OUTPUT
          elif [ ${{ matrix.arch }} == "arm64" ]
          then
            echo "target=aarch64-unknown-linux-musl" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - name: Fetch Virtiofsd
        uses: ./.github/actions/clone-verified/
        with:
          repository: https://gitlab.com/virtio-fs/virtiofsd.git
          version: ${{ inputs.virtiofsd_version }}
          commit: ${{ inputs.virtiofsd_commit }}
          path: virtiofsd_source

      - name: Build Virtiofsd
        uses: ./virtiofsd
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -C link-self-contained=yes"
          LIBSECCOMP_LINK_TYPE: "static"
          LIBSECCOMP_LIB_PATH: "/usr/lib"
          LIBCAPNG_LINK_TYPE: "static"
          LIBCAPNG_LIB_PATH: "/usr/lib"
          TARGET: ${{ steps.arch_map.outputs.target }}
          ARCH: ${{ matrix.arch }}
        with:
          # Name the binary as in the releases
          args: |
            set -eux
            rustup target add "$TARGET"
            cd virtiofsd_source
            cargo build --release --target "$TARGET"
            cp target/"$TARGET"/release/virtiofsd /github/workspace/virtiofsd-"$ARCH"

      - name: Archive Virtiofsd artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtiofsd-${{ matrix.arch }}
          path: virtiofsd-${{ matrix.arch }}
