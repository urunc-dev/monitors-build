name: Provide monitor artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - VERSION
      - qemu/**
      - solo5/**
      - firecracker/**
      - cloud-hypervisor/**
      - virtiofsd/**
      # The workflows define how the monitors get built and released
      - .github/**
  push:
    branches:
      - main
    paths:
      - VERSION
      - qemu/**
      - solo5/**
      - firecracker/**
      - cloud-hypervisor/**
      - virtiofsd/**
      # The workflows define how the monitors get built and released
      - .github/**

# Jobs that need more permissions request them themselves
permissions:
  contents: read

jobs:
  get-versions:
    name: Get the versions of all artifacts from their respeective VERSION files
    runs-on: ubuntu-latest
    outputs:
      release_series: ${{ steps.versions.outputs.release_series }}
      qemu_version: ${{ steps.versions.outputs.qemu_version }}
      solo5_version: ${{ steps.versions.outputs.solo5_version }}
      firecracker_version: ${{ steps.versions.outputs.firecracker_version }}
      cloud-hypervisor_version: ${{ steps.versions.outputs.cloud-hypervisor_version }}
      virtiofsd_version: ${{ steps.versions.outputs.virtiofsd_version }}
      qemu_commit: ${{ steps.versions.outputs.qemu_commit }}
      solo5_commit: ${{ steps.versions.outputs.solo5_commit }}
      virtiofsd_commit: ${{ steps.versions.outputs.virtiofsd_commit }}
      qemu_hash: ${{ steps.versions.outputs.qemu_hash }}
      qemu_build_id: ${{ steps.versions.outputs.qemu_build_id }}
      solo5_build_id: ${{ steps.versions.outputs.solo5_build_id }}
      virtiofsd_build_id: ${{ steps.versions.outputs.virtiofsd_build_id }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Get versions to build
        id: versions
        run: |
          RELEASE_SERIES="$(cat VERSION)"
          if ! [[ "$RELEASE_SERIES" =~ ^v[0-9]+\.[0-9]+$ ]]
          then
            echo "::error file=VERSION::VERSION must contain the release major and minor version (e.g. v0.1), got '$RELEASE_SERIES'"
            exit 1
          fi
          QEMU_VERSION="$(cat qemu/VERSION)"
          SOLO5_VERSION="$(cat solo5/VERSION)"
          FIRECRACKER_VERSION="$(cat firecracker/VERSION)"
          CLOUD_HYPERVISOR_VERSION="$(cat cloud-hypervisor/VERSION)"
          VIRTIOFSD_VERSION="$(cat virtiofsd/VERSION)"
          QEMU_COMMIT="$(cat qemu/COMMIT)"
          SOLO5_COMMIT="$(cat solo5/COMMIT)"
          VIRTIOFSD_COMMIT="$(cat virtiofsd/COMMIT)"
          QEMU_AMD64_CONFIG=$( LC_ALL=C sort qemu/amd64.config )
          QEMU_ARM64_CONFIG=$( LC_ALL=C sort qemu/arm64.config )
          QEMU_IGNORE_LIST=$( LC_ALL=C sort qemu/unnecessary_files.txt )
          # The exclude list contains patterns like "*/bin/qemu-pr-helper".
          # set -f stops the shell from replacing them with matching files of
          # the current directory, which would change the hash.
          # The variables stay unquoted on purpose: this joins all their
          # lines with single spaces and keeps the hash of existing releases.
          QEMU_HASH=$( set -f; echo $QEMU_AMD64_CONFIG $QEMU_ARM64_CONFIG $QEMU_IGNORE_LIST | md5sum | cut -d ' ' -f 1)
          # The monitors built from source are identified in release
          # descriptions by their version and a hash of everything that
          # defines their build: their directory (e.g. VERSION, COMMIT, Qemu
          # configuration files, Virtiofsd Dockerfile) and their workflow.
          # Hence, a change in any of them leads to a new build.
          build_hash() {
            local files
            files="$(git ls-tree -r HEAD -- "$@")"
            if [[ -z "$files" ]]
            then
              echo "::error::None of $* found" >&2
              return 1
            fi
            sha256sum <<< "$files" | cut -c1-12
          }
          QEMU_BUILD_ID="${QEMU_VERSION}-$(build_hash qemu .github/workflows/qemu_build.yaml)"
          SOLO5_BUILD_ID="${SOLO5_VERSION}-$(build_hash solo5 .github/workflows/solo5_build.yaml)"
          VIRTIOFSD_BUILD_ID="${VIRTIOFSD_VERSION}-$(build_hash virtiofsd .github/workflows/virtiofsd_build.yaml)"
          echo "release_series=$RELEASE_SERIES" >> $GITHUB_OUTPUT
          echo "qemu_version=$QEMU_VERSION" >> $GITHUB_OUTPUT
          echo "solo5_version=$SOLO5_VERSION" >> $GITHUB_OUTPUT
          echo "firecracker_version=$FIRECRACKER_VERSION" >> $GITHUB_OUTPUT
          echo "cloud-hypervisor_version=$CLOUD_HYPERVISOR_VERSION" >> $GITHUB_OUTPUT
          echo "virtiofsd_version=$VIRTIOFSD_VERSION" >> $GITHUB_OUTPUT
          echo "qemu_commit=$QEMU_COMMIT" >> $GITHUB_OUTPUT
          echo "solo5_commit=$SOLO5_COMMIT" >> $GITHUB_OUTPUT
          echo "virtiofsd_commit=$VIRTIOFSD_COMMIT" >> $GITHUB_OUTPUT
          echo "qemu_hash=$QEMU_HASH" >> $GITHUB_OUTPUT
          echo "qemu_build_id=$QEMU_BUILD_ID" >> $GITHUB_OUTPUT
          echo "solo5_build_id=$SOLO5_BUILD_ID" >> $GITHUB_OUTPUT
          echo "virtiofsd_build_id=$VIRTIOFSD_BUILD_ID" >> $GITHUB_OUTPUT
          echo "$RELEASE_SERIES"
          echo "$QEMU_VERSION"
          echo "$SOLO5_VERSION"
          echo "$FIRECRACKER_VERSION"
          echo "$CLOUD_HYPERVISOR_VERSION"
          echo "$VIRTIOFSD_VERSION"
          echo "$QEMU_COMMIT"
          echo "$SOLO5_COMMIT"
          echo "$VIRTIOFSD_COMMIT"
          echo "$QEMU_BUILD_ID"
          echo "$SOLO5_BUILD_ID"
          echo "$VIRTIOFSD_BUILD_ID"

  check-release-existence:
    name: Check if release already exists
    needs: [get-versions]
    runs-on: ubuntu-latest
    outputs: 
      release: ${{ steps.check.outputs.release }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      # Values that come from files of the repository are passed through the
      # environment, since expressions in scripts are pasted in as code
      - name: Generate monitors fingerprint
        id: fingerprint
        env:
          QEMU_VERSION: ${{ needs.get-versions.outputs.qemu_version }}
          QEMU_HASH: ${{ needs.get-versions.outputs.qemu_hash }}
          SOLO5_VERSION: ${{ needs.get-versions.outputs.solo5_version }}
          FIRECRACKER_VERSION: ${{ needs.get-versions.outputs.firecracker_version }}
          CLOUD_HYPERVISOR_VERSION: ${{ needs.get-versions.outputs.cloud-hypervisor_version }}
          VIRTIOFSD_VERSION: ${{ needs.get-versions.outputs.virtiofsd_version }}
        run: |
          SHORT_HASH="${QEMU_HASH:0:5}"
          echo "fingerprint=FC-${FIRECRACKER_VERSION}_CLH-${CLOUD_HYPERVISOR_VERSION}_S5-${SOLO5_VERSION}_VFS-${VIRTIOFSD_VERSION}_QM-${QEMU_VERSION}-${SHORT_HASH}" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIES: ${{ needs.get-versions.outputs.release_series }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          QEMU_BUILD_ID: ${{ needs.get-versions.outputs.qemu_build_id }}
          SOLO5_BUILD_ID: ${{ needs.get-versions.outputs.solo5_build_id }}
          VIRTIOFSD_BUILD_ID: ${{ needs.get-versions.outputs.virtiofsd_build_id }}
        run: |
          set -euo pipefail
          # Find the latest vMAJOR.MINOR.PATCH release of the current series.
          # A failure of the API call fails the step, since it would otherwise
          # look like there is no release
          TAGS=$(gh api --paginate "repos/${{ github.repository }}/releases" --jq '.[].tag_name')
          # No release of the series is not an error
          LATEST=$( { grep -E "^${SERIES//./\\.}\.[0-9]+$" <<< "$TAGS" || true; } | sort -V | tail -n 1)
          if [[ -z "$LATEST" ]]
          then
            echo "No release found for ${SERIES}. Let's create ${SERIES}.0"
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "release=${SERIES}.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # The monitor versions of a release and the builds of the monitors
          # built from source are stored in its description
          LATEST_BODY=$(gh api "repos/${{ github.repository }}/releases/tags/${LATEST}" --jq '.body')
          if grep -qF "<!-- monitors-fingerprint: ${FINGERPRINT} -->" <<< "$LATEST_BODY" && \
             grep -qF "<!-- qemu: ${QEMU_BUILD_ID} -->" <<< "$LATEST_BODY" && \
             grep -qF "<!-- solo5: ${SOLO5_BUILD_ID} -->" <<< "$LATEST_BODY" && \
             grep -qF "<!-- virtiofsd: ${VIRTIOFSD_BUILD_ID} -->" <<< "$LATEST_BODY"
          then
            echo "Release ${LATEST} already contains ${FINGERPRINT}! Skipping creation."
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "release=${LATEST}" >> $GITHUB_OUTPUT
          else
            NEXT="${SERIES}.$(( ${LATEST##*.} + 1 ))"
            echo "Release ${LATEST} contains different monitors. Let's create ${NEXT}."
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "release=${NEXT}" >> $GITHUB_OUTPUT
          fi

  build-Qemu-artifacts:
    name: Check and build missing Qemu artifacts
    needs: [get-versions]
    uses: ./.github/workflows/qemu_build.yaml
    with:
      qemu_version: ${{ needs.get-versions.outputs.qemu_version }}
      qemu_commit: ${{ needs.get-versions.outputs.qemu_commit }}
      build_id: ${{ needs.get-versions.outputs.qemu_build_id }}
      arch: '["amd64", "arm64"]'
    secrets: inherit

  build-Solo5-artifacts:
    name: Check and build missing Solo5 artifacts
    needs: [get-versions]
    uses: ./.github/workflows/solo5_build.yaml
    with:
      solo5_version: ${{ needs.get-versions.outputs.solo5_version }}
      solo5_commit: ${{ needs.get-versions.outputs.solo5_commit }}
      build_id: ${{ needs.get-versions.outputs.solo5_build_id }}
      arch: '["amd64", "arm64"]'
    secrets: inherit

  build-Virtiofsd-artifacts:
    name: Check and build missing Virtiofsd artifact
    needs: [get-versions]
    uses: ./.github/workflows/virtiofsd_build.yaml
    with:
      virtiofsd_version: ${{ needs.get-versions.outputs.virtiofsd_version }}
      virtiofsd_commit: ${{ needs.get-versions.outputs.virtiofsd_commit }}
      build_id: ${{ needs.get-versions.outputs.virtiofsd_build_id }}
      arch: '["amd64", "arm64"]'
    secrets: inherit

  create-new-release:
    name: Create new release
    needs: [get-versions,check-release-existence,build-Qemu-artifacts,build-Solo5-artifacts,build-Virtiofsd-artifacts]
    if: ${{ github.event_name == 'push' && 
            needs.check-release-existence.outputs.exists == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      # Qemu, Solo5 and Virtiofsd come either from this run, if they were built
      # in it, or from the release they were found in. Both provide the same
      # files, named as in the releases.
      - name: Download artifacts built in this run
        if: ${{ needs.build-Qemu-artifacts.outputs.release == '' ||
                needs.build-Solo5-artifacts.outputs.release == '' ||
                needs.build-Virtiofsd-artifacts.outputs.release == '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: /tmp/monitors
          merge-multiple: true

      - name: Download artifacts from previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QEMU_RELEASE: ${{ needs.build-Qemu-artifacts.outputs.release }}
          SOLO5_RELEASE: ${{ needs.build-Solo5-artifacts.outputs.release }}
          VIRTIOFSD_RELEASE: ${{ needs.build-Virtiofsd-artifacts.outputs.release }}
        run: |
          set -euo pipefail
          # Downloads the given files from a release, if a release is given
          get_from_release() {
            local release="$1"
            shift
            if [[ -z "$release" ]]
            then
              return 0
            fi
            local patterns=()
            for file in "$@"
            do
              patterns+=(-p "$file")
            done
            echo "Downloading $* from release ${release}"
            gh release download "$release" -R "${{ github.repository }}" -D /tmp/monitors "${patterns[@]}"
          }
          get_from_release "$QEMU_RELEASE" qemu-amd64.tar.gz qemu-arm64.tar.gz
          get_from_release "$SOLO5_RELEASE" solo5-hvt-amd64 solo5-spt-amd64 solo5-hvt-arm64 solo5-spt-arm64
          get_from_release "$VIRTIOFSD_RELEASE" virtiofsd-amd64 virtiofsd-arm64

      - name: Download Firecracker amd64 binary
        env:
          VERSION: ${{ needs.get-versions.outputs.firecracker_version }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          FC_RELEASE_URL="https://github.com/firecracker-microvm/firecracker/releases"
          ASSET="firecracker-${VERSION}-x86_64.tgz"
          curl -fL -O ${FC_RELEASE_URL}/download/${VERSION}/${ASSET}
          curl -fL -O ${FC_RELEASE_URL}/download/${VERSION}/${ASSET}.sha256.txt
          sha256sum -c ${ASSET}.sha256.txt
          tar -xzf ${ASSET}
          mkdir /tmp/fc_amd64
          mv release-${VERSION}-x86_64/firecracker-${VERSION}-x86_64 /tmp/fc_amd64/firecracker

      - name: Download Firecracker arm64 binary
        env:
          VERSION: ${{ needs.get-versions.outputs.firecracker_version }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          FC_RELEASE_URL="https://github.com/firecracker-microvm/firecracker/releases"
          ASSET="firecracker-${VERSION}-aarch64.tgz"
          curl -fL -O ${FC_RELEASE_URL}/download/${VERSION}/${ASSET}
          curl -fL -O ${FC_RELEASE_URL}/download/${VERSION}/${ASSET}.sha256.txt
          sha256sum -c ${ASSET}.sha256.txt
          tar -xzf ${ASSET}
          mkdir /tmp/fc_arm64
          mv release-${VERSION}-aarch64/firecracker-${VERSION}-aarch64 /tmp/fc_arm64/firecracker

      - name: Download Cloud-Hypervisor amd64 binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-versions.outputs.cloud-hypervisor_version }}
        run: |
          set -euo pipefail
          mkdir /tmp/clh_amd64
          CLH_RELEASE_URL=https://github.com/cloud-hypervisor/cloud-hypervisor/releases
          ASSET=cloud-hypervisor-static
          curl -fL -o /tmp/clh_amd64/cloud-hypervisor ${CLH_RELEASE_URL}/download/${VERSION}/${ASSET}
          # Cloud-Hypervisor does not publish a checksum file, use the digest
          # GitHub computed for the release asset instead
          DIGEST=$(gh api "repos/cloud-hypervisor/cloud-hypervisor/releases/tags/${VERSION}" \
                    --jq ".assets[] | select(.name == \"${ASSET}\") | .digest")
          if [[ "$DIGEST" != sha256:* ]]
          then
            echo "::error::No sha256 digest found for ${ASSET} of Cloud-Hypervisor ${VERSION}"
            exit 1
          fi
          echo "${DIGEST#sha256:}  /tmp/clh_amd64/cloud-hypervisor" | sha256sum -c -

      - name: Download Cloud-Hypervisor arm64 binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-versions.outputs.cloud-hypervisor_version }}
        run: |
          set -euo pipefail
          mkdir /tmp/clh_arm64
          CLH_RELEASE_URL=https://github.com/cloud-hypervisor/cloud-hypervisor/releases
          ASSET=cloud-hypervisor-static-aarch64
          curl -fL -o /tmp/clh_arm64/cloud-hypervisor ${CLH_RELEASE_URL}/download/${VERSION}/${ASSET}
          # Cloud-Hypervisor does not publish a checksum file, use the digest
          # GitHub computed for the release asset instead
          DIGEST=$(gh api "repos/cloud-hypervisor/cloud-hypervisor/releases/tags/${VERSION}" \
                    --jq ".assets[] | select(.name == \"${ASSET}\") | .digest")
          if [[ "$DIGEST" != sha256:* ]]
          then
            echo "::error::No sha256 digest found for ${ASSET} of Cloud-Hypervisor ${VERSION}"
            exit 1
          fi
          echo "${DIGEST#sha256:}  /tmp/clh_arm64/cloud-hypervisor" | sha256sum -c -

      - name: Package all artifacts
        env:
          RELEASE: ${{ needs.check-release-existence.outputs.release }}
          FINGERPRINT: ${{ needs.check-release-existence.outputs.fingerprint }}
          QEMU_VERSION: ${{ needs.get-versions.outputs.qemu_version }}
          QEMU_HASH: ${{ needs.get-versions.outputs.qemu_hash }}
          SOLO5_VERSION: ${{ needs.get-versions.outputs.solo5_version }}
          FIRECRACKER_VERSION: ${{ needs.get-versions.outputs.firecracker_version }}
          CLOUD_HYPERVISOR_VERSION: ${{ needs.get-versions.outputs.cloud-hypervisor_version }}
          VIRTIOFSD_VERSION: ${{ needs.get-versions.outputs.virtiofsd_version }}
          QEMU_BUILD_ID: ${{ needs.get-versions.outputs.qemu_build_id }}
          SOLO5_BUILD_ID: ${{ needs.get-versions.outputs.solo5_build_id }}
          VIRTIOFSD_BUILD_ID: ${{ needs.get-versions.outputs.virtiofsd_build_id }}
        run: |
          set -euo pipefail
          mkdir release
          for arch in amd64 arm64
          do
            cp /tmp/monitors/qemu-${arch}.tar.gz release/
            # Artifacts do not preserve the file permissions
            install -m 755 /tmp/fc_${arch}/firecracker release/firecracker-${arch}
            install -m 755 /tmp/clh_${arch}/cloud-hypervisor release/cloud-hypervisor-${arch}
            install -m 755 /tmp/monitors/solo5-hvt-${arch} release/solo5-hvt-${arch}
            install -m 755 /tmp/monitors/solo5-spt-${arch} release/solo5-spt-${arch}
            install -m 755 /tmp/monitors/virtiofsd-${arch} release/virtiofsd-${arch}

            # Bundle with all monitors under /opt/urunc
            BUNDLE=/tmp/bundle_${arch}
            mkdir "$BUNDLE"
            tar -C "$BUNDLE" -xzf release/qemu-${arch}.tar.gz
            install -m 755 release/firecracker-${arch} "$BUNDLE"/urunc/bin/firecracker
            install -m 755 release/cloud-hypervisor-${arch} "$BUNDLE"/urunc/bin/cloud-hypervisor
            install -m 755 release/solo5-hvt-${arch} "$BUNDLE"/urunc/bin/solo5-hvt
            install -m 755 release/solo5-spt-${arch} "$BUNDLE"/urunc/bin/solo5-spt
            install -m 755 release/virtiofsd-${arch} "$BUNDLE"/urunc/bin/virtiofsd
            tar -C "$BUNDLE" -czf release/${FINGERPRINT}-${arch}.tar.gz .
          done
          ls -la release

          cat > release_notes.md << EOF
          This release contains statically-built artifacts for both amd64 and arm64 of the following monitors and tools:
          - Qemu: ${QEMU_VERSION} (hash of config files: ${QEMU_HASH})
          - Solo5(hvt and spt): ${SOLO5_VERSION}
          - Firecracker: ${FIRECRACKER_VERSION}
          - Cloud-Hypervisor: ${CLOUD_HYPERVISOR_VERSION}
          - Virtiofsd: ${VIRTIOFSD_VERSION}

          Artifacts (\`<arch>\` is \`amd64\` or \`arm64\`):
          - \`firecracker-<arch>\`, \`cloud-hypervisor-<arch>\`, \`solo5-hvt-<arch>\`, \`solo5-spt-<arch>\`, \`virtiofsd-<arch>\`: static binaries
          - \`qemu-<arch>.tar.gz\`: Qemu binary and its firmware files. Extract with \`tar -C /opt -xzf qemu-<arch>.tar.gz\`
          - \`${FINGERPRINT}-<arch>.tar.gz\`: All of the above. Extract with \`tar -C /opt -xzf ${FINGERPRINT}-<arch>.tar.gz\`

          <!-- monitors-fingerprint: ${FINGERPRINT} -->
          <!-- qemu: ${QEMU_BUILD_ID} -->
          <!-- solo5: ${SOLO5_BUILD_ID} -->
          <!-- virtiofsd: ${VIRTIOFSD_BUILD_ID} -->
          EOF
          cat release_notes.md

      # The tag is created along with the release, at the merged commit.
      # Hence, a failed build does not leave a tag behind
      - name: Create release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        id: create_release
        with:
          files: release/*
          body_path: "release_notes.md"
          name: ${{ needs.check-release-existence.outputs.release }}
          draft: false
          prerelease: true
          generate_release_notes: false
          tag_name: ${{ needs.check-release-existence.outputs.release }}
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  comment-artifact-links:
    name: Post links for artifacts
    needs: [get-versions,check-release-existence,build-Qemu-artifacts,build-Solo5-artifacts,build-Virtiofsd-artifacts]
    if: ${{ github.event_name == 'pull_request' && 
            needs.check-release-existence.outputs.exists == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Set download links
        id: links
        env:
          QEMU_RELEASE: ${{ needs.build-Qemu-artifacts.outputs.release }}
          SOLO5_RELEASE: ${{ needs.build-Solo5-artifacts.outputs.release }}
          VIRTIOFSD_RELEASE: ${{ needs.build-Virtiofsd-artifacts.outputs.release }}
          FIRECRACKER_VERSION: ${{ needs.get-versions.outputs.firecracker_version }}
          CLOUD_HYPERVISOR_VERSION: ${{ needs.get-versions.outputs.cloud-hypervisor_version }}
          RELEASE: ${{ needs.check-release-existence.outputs.release }}
        run: |
          # Monitors that were not found in a release were built in this run
          link() {
            if [[ -n "$1" ]]
            then
              echo "https://github.com/${{ github.repository }}/releases/tag/$1"
            else
              echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
          }
          QEMU_LINK=$(link "$QEMU_RELEASE")
          SOLO5_LINK=$(link "$SOLO5_RELEASE")
          VIRTIOFSD_LINK=$(link "$VIRTIOFSD_RELEASE")

          FC_RELEASE_URL="https://github.com/firecracker-microvm/firecracker/releases"
          FC_LINK="${FC_RELEASE_URL}/tag/${FIRECRACKER_VERSION}"
          CLH_RELEASE_URL=https://github.com/cloud-hypervisor/cloud-hypervisor/releases
          CLH_LINK="${CLH_RELEASE_URL}/tag/${CLOUD_HYPERVISOR_VERSION}"
          echo "qemu=${QEMU_LINK}" >> $GITHUB_OUTPUT
          echo "solo5=${SOLO5_LINK}" >> $GITHUB_OUTPUT
          echo "virtiofsd=${VIRTIOFSD_LINK}" >> $GITHUB_OUTPUT
          echo "firecracker=${FC_LINK}" >> $GITHUB_OUTPUT
          echo "cloud-hypervisor=${CLH_LINK}" >> $GITHUB_OUTPUT
          if ${{ needs.check-release-existence.outputs.exists == 'false' }}
          then
            echo "release=" >> $GITHUB_OUTPUT
          else
            echo "release=https://github.com/${{ github.repository }}/releases/tag/${RELEASE}" >> $GITHUB_OUTPUT
          fi

      - name: Add ccomment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          QEMU_TEXT: "Qemu ${{ needs.get-versions.outputs.qemu_build_id }}: ${{ steps.links.outputs.qemu }}"
          SOLO5_TEXT: "Solo5 ${{ needs.get-versions.outputs.solo5_build_id }}: ${{ steps.links.outputs.solo5 }}"
          VFS_TEXT: "Virtiofsd ${{ needs.get-versions.outputs.virtiofsd_build_id }}: ${{ steps.links.outputs.virtiofsd }}"
          FC_TEXT: "Firecracker ${{ needs.get-versions.outputs.firecracker_version }}: ${{ steps.links.outputs.firecracker }}"
          CLH_TEXT: "Cloud-Hypervisor ${{ needs.get-versions.outputs.cloud-hypervisor_version }}: ${{ steps.links.outputs.cloud-hypervisor }}"
        with:
          script: |
            const body = `
            Links to download artifacts for amd64 and aarch64 architectures:
            - ${process.env.QEMU_TEXT}
            - ${process.env.SOLO5_TEXT}
            - ${process.env.VFS_TEXT}
            - ${process.env.FC_TEXT}
            - ${process.env.CLH_TEXT}
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })
